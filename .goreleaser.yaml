version: 2

project_name: taildoc

before:
  hooks:
    - go mod tidy

builds:
  - id: taildoc
    main: ./cmd/taildoc
    binary: taildoc
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X github.com/huza1fa/taildoc/internal/cli.Version={{.Version}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
